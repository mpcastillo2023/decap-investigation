# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mpcastillo2023/decap-investigation
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/56484b36-aca5-4127-93d3-5b41c310c50f/pkce
  auth_token_endpoint: /sites/56484b36-aca5-4127-93d3-5b41c310c50f/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://decap-investigation.onrender.com

locale: en
media_folder: static/media
public_folder: /media

collections:
  - name: spanish-navigation
    label: Secciones del menú lateral (es)
    description: Configura cómo aparecen los documentos de la carpeta visita/ en el menú lateral. El contenido se edita desde Español.
    files:
      - name: visit-category
        label: Carpeta visita/ — ajustes del menú
        file: docs/visita/_category_.json
        fields:
          - { name: label, label: Etiqueta, widget: string }
          - { name: position, label: Posición, widget: number, required: false }
          - { name: collapsible, label: Plegable, widget: boolean, required: false }
          - { name: collapsed, label: Plegada por defecto, widget: boolean, required: false }
          - name: customProps
            label: Opciones de visualización
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar en el menú, widget: boolean, default: true }
          - name: link
            label: Enlace de categoría
            widget: object
            required: false
            fields:
              - { name: type, label: Tipo, widget: select, options: [generated-index, doc] }
              - { name: title, label: Título, widget: string, required: false }
              - { name: description, label: Descripción, widget: string, required: false }
              - { name: slug, label: Slug, widget: string, required: false }
              - { name: id, label: ID de documento, widget: string, required: false }
  - name: english-navigation
    label: Sidebar sections (en)
    description: Configure how documents in the visita/ folder appear in the sidebar. Edit their content under English.
    files:
      - name: visit-category
        label: visita/ folder — sidebar settings
        file: i18n/en/docusaurus-plugin-content-docs/current/visita/_category_.json
        fields:
          - { name: label, label: Label, widget: string }
          - { name: position, label: Position, widget: number, required: false }
          - { name: collapsible, label: Collapsible, widget: boolean, required: false }
          - { name: collapsed, label: Collapsed by default, widget: boolean, required: false }
          - name: customProps
            label: Display options
            widget: object
            fields:
              - { name: showInMenu, label: Show in menu, widget: boolean, default: true }
          - name: link
            label: Category link
            widget: object
            required: false
            fields:
              - { name: type, label: Type, widget: select, options: [generated-index, doc] }
              - { name: title, label: Title, widget: string, required: false }
              - { name: description, label: Description, widget: string, required: false }
              - { name: slug, label: Slug, widget: string, required: false }
              - { name: id, label: Document ID, widget: string, required: false }
  - name: catalan-navigation
    label: Seccions del menú lateral (ca)
    description: Configura com apareixen els documents de la carpeta visita/ al menú lateral. El contingut s'edita des de Català.
    files:
      - name: visit-category
        label: Carpeta visita/ — ajustos del menú
        file: i18n/ca/docusaurus-plugin-content-docs/current/visita/_category_.json
        fields:
          - { name: label, label: Etiqueta, widget: string }
          - { name: position, label: Posició, widget: number, required: false }
          - { name: collapsible, label: Plegable, widget: boolean, required: false }
          - { name: collapsed, label: Plegada per defecte, widget: boolean, required: false }
          - name: customProps
            label: Opcions de visualització
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar al menú, widget: boolean, default: true }
          - name: link
            label: Enllaç de categoria
            widget: object
            required: false
            fields:
              - { name: type, label: Tipus, widget: select, options: [generated-index, doc] }
              - { name: title, label: Títol, widget: string, required: false }
              - { name: description, label: Descripció, widget: string, required: false }
              - { name: slug, label: Slug, widget: string, required: false }
              - { name: id, label: ID del document, widget: string, required: false }
  # Other document languages inherit these settings and override their paths and labels.
  - &document_collection
    name: spanish
    label: Español
    folder: docs
    create: true
    nested:
      depth: 4
      summary: '{{title}}'
      subfolders: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: title, label: Título, widget: string }
      - { name: description, label: Descripción, widget: string, required: false }
      - { name: sidebar_label, label: Nombre en el menú, widget: string, required: false }
      - { name: sidebar_position, label: Posición, widget: number, required: false }
      - { name: body, label: Contenido, widget: markdown }
    meta:
      path: { widget: string, label: Ruta dentro del idioma }
  - <<: *document_collection
    name: english
    label: English
    folder: i18n/en/docusaurus-plugin-content-docs/current
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string, required: false }
      - { name: sidebar_label, label: Sidebar label, widget: string, required: false }
      - { name: sidebar_position, label: Position, widget: number, required: false }
      - { name: body, label: Content, widget: markdown }
    meta:
      path: { widget: string, label: Path within language }
  - <<: *document_collection
    name: catalan
    label: Català
    folder: i18n/ca/docusaurus-plugin-content-docs/current
    fields:
      - { name: title, label: Títol, widget: string }
      - { name: description, label: Descripció, widget: string, required: false }
      - { name: sidebar_label, label: Etiqueta del menú, widget: string, required: false }
      - { name: sidebar_position, label: Posició, widget: number, required: false }
      - { name: body, label: Contingut, widget: markdown }
    meta:
      path: { widget: string, label: Camí dins l’idioma }
