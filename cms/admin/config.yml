# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mpcastillo2023/decap-investigation
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/56484b36-aca5-4127-93d3-5b41c310c50f/pkce
  auth_token_endpoint: /sites/56484b36-aca5-4127-93d3-5b41c310c50f/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://decap-investigation.onrender.com

locale: en
media_folder: static/media
public_folder: /media

collections:
  - name: spanish-navigation
    label: Secciones del menú lateral (es)
    description: Configura las categorías de distribuidores, afiliados y vouchers del menú lateral. El contenido se edita desde Español.
    files:
      - name: sellers-category
        label: Categoría Distribuidores — ajustes del menú
        file: docs/sellers/_category_.json
        fields:
          - { name: label, label: Nombre en el menú, widget: string }
          - { name: position, label: Posición, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opciones de visualización
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar en el menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: sellers/index }, required: false }
      - name: affiliates-category
        label: Categoría Afiliados — ajustes del menú
        file: docs/affiliates/_category_.json
        fields:
          - { name: label, label: Nombre en el menú, widget: string }
          - { name: position, label: Posición, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opciones de visualización
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar en el menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: affiliates/index }, required: false }
      - name: vouchers-category
        label: Categoría Vouchers — ajustes del menú
        file: docs/vouchers/_category_.json
        fields:
          - { name: label, label: Nombre en el menú, widget: string }
          - { name: position, label: Posición, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opciones de visualización
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar en el menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: vouchers/index }, required: false }
  - name: english-navigation
    label: Sidebar sections (en)
    description: Configure the seller, affiliate, and voucher sidebar categories. Edit document content under English.
    files:
      - name: sellers-category
        label: Category — Distributors menu settings
        file: i18n/en/docusaurus-plugin-content-docs/current/sellers/_category_.json
        fields:
          - { name: label, label: Menu name, widget: string }
          - { name: position, label: Position, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Display options
            widget: object
            fields:
              - { name: showInMenu, label: Show in menu, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: sellers/index }, required: false }
      - name: affiliates-category
        label: Category — Affiliates menu settings
        file: i18n/en/docusaurus-plugin-content-docs/current/affiliates/_category_.json
        fields:
          - { name: label, label: Menu name, widget: string }
          - { name: position, label: Position, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Display options
            widget: object
            fields:
              - { name: showInMenu, label: Show in menu, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: affiliates/index }, required: false }
      - name: vouchers-category
        label: Category — Vouchers menu settings
        file: i18n/en/docusaurus-plugin-content-docs/current/vouchers/_category_.json
        fields:
          - { name: label, label: Menu name, widget: string }
          - { name: position, label: Position, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Display options
            widget: object
            fields:
              - { name: showInMenu, label: Show in menu, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: vouchers/index }, required: false }
  - name: catalan-navigation
    label: Seccions del menú lateral (ca)
    description: Configura les categories de distribuïdors, afiliats i vouchers del menú lateral. El contingut s’edita des de Català.
    files:
      - name: sellers-category
        label: Categoria Distribuïdors — ajustos del menú
        file: i18n/ca/docusaurus-plugin-content-docs/current/sellers/_category_.json
        fields:
          - { name: label, label: Nom al menú, widget: string }
          - { name: position, label: Posició, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opcions de visualització
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar al menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: sellers/index }, required: false }
      - name: affiliates-category
        label: Categoria Afiliats — ajustos del menú
        file: i18n/ca/docusaurus-plugin-content-docs/current/affiliates/_category_.json
        fields:
          - { name: label, label: Nom al menú, widget: string }
          - { name: position, label: Posició, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opcions de visualització
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar al menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: affiliates/index }, required: false }
      - name: vouchers-category
        label: Categoria Vouchers — ajustos del menú
        file: i18n/ca/docusaurus-plugin-content-docs/current/vouchers/_category_.json
        fields:
          - { name: label, label: Nom al menú, widget: string }
          - { name: position, label: Posició, widget: number, required: false }
          - { name: collapsible, widget: hidden, default: true, required: false }
          - { name: collapsed, widget: hidden, default: false, required: false }
          - name: customProps
            label: Opcions de visualització
            widget: object
            fields:
              - { name: showInMenu, label: Mostrar al menú, widget: boolean, default: true }
          - { name: link, widget: hidden, default: { type: doc, id: vouchers/index }, required: false }
  # Other document languages inherit these settings and override their paths and labels.
  - &document_collection
    name: spanish
    label: Español
    folder: docs
    create: true
    nested:
      depth: 4
      summary: '{{title}}'
      subfolders: false
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { name: title, label: Título, widget: string }
      - { name: description, label: Descripción, widget: string, required: false }
      - { name: sidebar_label, label: Nombre en el menú, widget: string, required: false }
      - { name: sidebar_position, label: Posición, widget: number, required: false }
      - name: sidebar_custom_props
        label: Opciones del menú
        widget: object
        required: false
        fields:
          - { name: showInMenu, label: Mostrar en el menú, widget: boolean, default: true }
      - { name: body, label: Contenido, widget: markdown }
    meta:
      path: { widget: string, label: Carpeta de destino, hint: "Ruta relativa a los documentos de este idioma; por ejemplo, affiliates. Los documentos se guardan como archivos Markdown directamente en esa carpeta." }
  - <<: *document_collection
    name: english
    label: English
    folder: i18n/en/docusaurus-plugin-content-docs/current
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string, required: false }
      - { name: sidebar_label, label: Sidebar label, widget: string, required: false }
      - { name: sidebar_position, label: Position, widget: number, required: false }
      - name: sidebar_custom_props
        label: Menu options
        widget: object
        required: false
        fields:
          - { name: showInMenu, label: Show in menu, widget: boolean, default: true }
      - { name: body, label: Content, widget: markdown }
    meta:
      path: { widget: string, label: Destination folder, hint: "Folder relative to this language; for example, affiliates. Documents are saved as Markdown files directly inside that folder." }
  - <<: *document_collection
    name: catalan
    label: Català
    folder: i18n/ca/docusaurus-plugin-content-docs/current
    fields:
      - { name: title, label: Títol, widget: string }
      - { name: description, label: Descripció, widget: string, required: false }
      - { name: sidebar_label, label: Etiqueta del menú, widget: string, required: false }
      - { name: sidebar_position, label: Posició, widget: number, required: false }
      - name: sidebar_custom_props
        label: Opcions del menú
        widget: object
        required: false
        fields:
          - { name: showInMenu, label: Mostrar al menú, widget: boolean, default: true }
      - { name: body, label: Contingut, widget: markdown }
    meta:
      path: { widget: string, label: Carpeta de destinació, hint: "Carpeta relativa als documents d’aquest idioma; per exemple, affiliates. Els documents es desen com a fitxers Markdown directament dins d’aquesta carpeta." }
